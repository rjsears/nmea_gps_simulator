services:
  dashboard:
    image: rjsears/fleet-dashboard:latest
    pull_policy: always
    container_name: fleet-dashboard
    restart: unless-stopped
    network_mode: host
    security_opt:
      - "apparmor:unconfined"
    volumes:
      # Flight data recordings (SQLite). Keeps history across image updates.
      - ./data:/app/data
    environment:
      # Server configuration
      - HOST=0.0.0.0
      - PORT=80

      # Flight data recording
      # Positions from every simulator are stored while it is sending data.
      # Recording can be switched per simulator from the Flight Data panel.
      - RECORDING_DEFAULT_ENABLED=true   # Initial state for newly added sims
      - RECORDING_RETENTION_DAYS=30      # Auto-delete older data (0 = keep forever)

      # Simulator configuration
      # Each emulator should send UDP to this dashboard's IP on its assigned port
      # GPS_SYSTEM is shown when GPS data stops (tells tech which system to restart)
      # SWITCH_IP is the management IP of the switch feeding the sim; the dashboard pings it every second (leave empty to skip)
      - SIM_1_NAME=CJ3
      - SIM_1_PORT=12001
      - SIM_1_GPS_SYSTEM=Avionics
      - SIM_1_SWITCH_IP=10.200.10.6
      - SIM_2_NAME=Ultra
      - SIM_2_PORT=12002
      - SIM_2_GPS_SYSTEM=Avionics 2
      - SIM_2_SWITCH_IP=10.200.10.27
      - SIM_3_NAME=CJ1
      - SIM_3_PORT=12003
      - SIM_3_GPS_SYSTEM=Avionics
      - SIM_3_SWITCH_IP=10.200.10.8
      - SIM_4_NAME=CE560XL
      - SIM_4_PORT=12004
      - SIM_4_GPS_SYSTEM=Avionics 2
      - SIM_4_SWITCH_IP=10.200.10.18
      - SIM_5_NAME=Classic CJ1
      - SIM_5_PORT=12005
      - SIM_5_GPS_SYSTEM=Avionics
      - SIM_5_SWITCH_IP=10.200.10.4
      - SIM_6_NAME=CL350
      - SIM_6_PORT=12006
      - SIM_6_GPS_SYSTEM=rehost
      - SIM_6_SWITCH_IP=172.16.24.1
